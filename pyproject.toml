[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buna-screening-tool"
version = "0.1.0"
description = "Local-first, evidence-based scientific manuscript text overlap screening"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.18,<1",
  "pypdf>=5,<7",
  "fonttools>=4.50,<5",
  "pymupdf>=1.24.9,<2",
  "httpx>=0.27,<1",
  "psutil>=6,<8",
  "PyJWT[crypto]>=2.10,<3",
  "azure-identity>=1.20,<2",
  "azure-storage-blob>=12.25,<13",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["buna*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
